[versions]
eupid = "3.5.0-SNAPSHOT"
eupid-sdjwt = "1.4.0"
mdl = "1.4.0"
taxid = "1.3.0"
por = "1.4.0"
cor = "2.3.0"
ehic = "1.3.0"
av = "1.1.0"
qrcode = "4.5.0"
pgsql = "42.7.7"
mockito = "6.2.1"
vck = "5.13.0-SNAPSHOT"
nimbus = "10.7"

spring-boot = "4.0.6"
spring-cloud = "2025.1.1"
spring-admin-starter-client = "4.0.4"

webjars-locator = "0.47"
webjars-bootstrap = "5.3.1"
webjars-jquery = "3.7.1"
webjars-datatables = "1.13.5"

kotlin = "2.3.0"

[libraries]
spring-boot-admin-starter-client = { module = "de.codecentric:spring-boot-admin-starter-client", version.ref = "spring-admin-starter-client" }
nimbus-jose-jwt = { module = "com.nimbusds:nimbus-jose-jwt", version.ref = "nimbus" }
webjars-locator = { module = "org.webjars:webjars-locator", version.ref = "webjars-locator" }
webjars-bootstrap = { module = "org.webjars:bootstrap", version.ref = "webjars-bootstrap" }
webjars-jquery = { module = "org.webjars:jquery", version.ref = "webjars-jquery" }
webjars-datatables = { module = "org.webjars:datatables", version.ref = "webjars-datatables" }
qrcode-kotlin = { module = "io.github.g0dkar:qrcode-kotlin", version.ref = "qrcode" }
wallet-taxid = { module = "at.asitplus.wallet:taxid", version.ref = "taxid" }
wallet-eupid = { module = "at.asitplus.wallet:eupidcredential", version.ref = "eupid" }
wallet-eupid-sdjwt = { module = "at.asitplus.wallet:eupidcredential-sdjwt", version.ref = "eupid-sdjwt" }
wallet-mdl = { module = "at.asitplus.wallet:mobiledrivinglicence", version.ref = "mdl" }
wallet-por = { module = "at.asitplus.wallet:powerofrepresentation", version.ref = "por" }
wallet-cor = { module = "at.asitplus.wallet:certificateofresidence", version.ref = "cor" }
wallet-ehic = { module = "at.asitplus.wallet:ehic", version.ref = "ehic" }
wallet-av = { module = "at.asitplus.wallet:ageverification", version.ref = "av" }
wallet-vck-jvm = { module = "at.asitplus.wallet:vck-jvm", version.ref = "vck" }
wallet-vck-openid-ktor-jvm = { module = "at.asitplus.wallet:vck-openid-ktor-jvm", version.ref = "vck" }
postgresql = { module = "org.postgresql:postgresql", version.ref = "pgsql" }
mockito-kotlin = { module = "org.mockito.kotlin:mockito-kotlin", version.ref = "mockito" }
spring-cloud-config-dependencies = { module = "org.springframework.cloud:spring-cloud-dependencies", version.ref = "spring-cloud" }
spring-cloud-starter-config = { module = "org.springframework.cloud:spring-cloud-starter-config" }

[bundles]
wallet = [
  "wallet-taxid",
  "wallet-eupid",
  "wallet-eupid-sdjwt",
  "wallet-mdl",
  "wallet-por",
  "wallet-cor",
  "wallet-ehic",
  "wallet-av",
  "wallet-vck-jvm",
  "wallet-vck-openid-ktor-jvm"
]
