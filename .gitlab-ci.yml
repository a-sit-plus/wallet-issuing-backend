variables:
  LC_ALL: "en_US.UTF-8"
  LANG: "en_US.UTF-8"
  LANGUAGE: "en_US"
  LIB_NAME: "backend"
  GRADLE_USER_HOME: "${CI_PROJECT_DIR}/.gradle"
  GRADLE_OPTS: "-Dorg.gradle.daemon=false -Dorg.gradle.console=plain -Dmaven.repo.local=${CI_PROJECT_DIR}/.m2/repository"
  GIT_STRATEGY: fetch
  GIT_SUBMODULE_STRATEGY: recursive
  GIT_DEPTH: "2"
  SECURE_LOG_LEVEL: "debug"
  SAST_JAVA_VERSION: 11
  SECRET_DETECTION_EXCLUDED_PATHS: ".gradle,gradle,.m2"

include:
  - template: Dependency-Scanning.gitlab-ci.yml
  - template: Security/SAST.gitlab-ci.yml
  - template: Secret-Detection.gitlab-ci.yml

default:
  image: gradle:jdk11
  tags:
    - docker

stages:
  - assemble
  - test
  - package
  - release

cache:
  paths:
    - ".gradle/wrapper"
    - ".gradle/caches"
    - ".m2/repository"

assembleJdk11:
  stage: assemble
  except:
    - tags
  script: |
    ./gradlew --continue clean assemble test build
  allow_failure: true
  artifacts:
    when: always
    reports:
      junit: "build/test-results/test/**/TEST-*.xml"

publishToGitlab:
  stage: package
  except:
    - tags
  only:
    - master
    - develop
  script: |
    export VERSION=$(./gradlew properties | grep "^version: " | grep -Po "\d+\.\d+\.\d+((-\w*)+)?")
    echo "Publishing version $VERSION for $LIB_NAME"
    ./gradlew --continue clean assemble publishAllPublicationsToGitlabRepository
    echo "VERSION=$VERSION" >> variables.env
  artifacts:
    when: always
    reports:
      dotenv: variables.env

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: publishToGitlab
      artifacts: true
  when: manual
  only:
    - master
  script: |
    echo "Releasing version $VERSION of $LIB_NAME"
    release-cli create --name "$VERSION" --tag-name "v$VERSION" --ref "$CI_COMMIT_SHA" --description "$(cat README.md)" \
        --assets-link "{\"name\":\"$LIB_NAME-$VERSION.pom\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/at/asitplus/wallet/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.pom\"}" \
        --assets-link "{\"name\":\"$LIB_NAME-$VERSION.md\", \"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/at/asitplus/wallet/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION-README.md\"}" \
        --assets-link "{\"name\":\"$LIB_NAME-$VERSION.jar\",\"url\":\"${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/maven/at/asitplus/wallet/$LIB_NAME/$VERSION/$LIB_NAME-$VERSION.jar\"}"
