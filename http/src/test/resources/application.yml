logging:
  level:
    at.asitplus: trace
spring:
  profiles:
    default: pupilid
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  datasource:
    url: "jdbc:h2:mem:userstore"
  test:
    mockmvc:
      print: log_debug
  config:
    import:
  cloud:
    config:
      enabled: false
backend:
  authn:
    device-binding:
      attestation:
        noop: true
  credentials:
    pictures:
      pathLibJni: "libwebp/libwebp_jni.so"
      pathLibWebp: "libwebp/libwebp.so.7.1.6"
      pathLibSharp: "libwebp/libsharpyuv.so.0"
