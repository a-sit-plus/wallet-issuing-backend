<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>A-SIT Plus Wallet</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css} "/>
</head>
<body style="background: #ececec;">
<div th:replace="fragments/navbar.html :: navbar"></div>
<div class="container my-3">
    <h1 class="display-4">Create Device Binding</h1>
    <p class="lead">
        You've received a QR Code to create a device binding for your Wallet App.
        Please install the Wallet App and scan the QR Code again.
    </p>

    <div class="d-flex justify-content-center my-3">
        <img th:width="${qrcodeWidth}" th:src="'data:image/png;base64,'+${qrcode}" alt="" src=""/>
    </div>
</div>
</body>
</html>
