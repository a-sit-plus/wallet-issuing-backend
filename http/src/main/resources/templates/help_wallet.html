<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Wallet Demo</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.0/css/bootstrap.min.css} "/>
</head>
<body style="background: #ececec;">
<div th:replace="fragments/navbar.html :: navbar"></div>
<div class="container my-3">
    <h1 class="display-4">Issue Invitation Demo</h1>
    <p class="lead">
        You've received an invitation to issue credentials for your Wallet App.
        Please install it from the Android Play Store or iOS App Store,
        or download a beta release from the <a th:href="@{/}">homepage</a>.
    </p>

    <p class="alert alert-light border" style="border-left: 0.5rem solid #5bc0de !important;">
        <span th:replace="fragments/icons.html :: info_icon"></span>
        Now you can scan the QR Code with your Wallet App to load credentials for your PupilID.
    </p>

    <div class="d-flex justify-content-center my-3">
        <img th:width="${qrcodeWidth}" th:src="'data:image/png;base64,'+${qrcode}" alt="" src=""/>
    </div>

</div>
</body>
</html>
