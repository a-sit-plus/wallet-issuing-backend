<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>Wallet Demo</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.0/css/bootstrap.min.css} "/>
</head>
<body>
<div th:replace="fragments/navbar.html :: navbar"></div>
<div class="container pt-3">
    <h1 class="display-4">Wallet</h1>
    <p class="lead">Try out the apps:</p>

    <ul class="list-group">
        <li class="list-group-item d-flex justify-content-between align-items-start">
            <div class="ms-2 me-auto">
                <span class="fw-bold">The Wallet App for Android</span>
                <span class="badge bg-secondary">New</span>
            </div>
            <span><a th:href="@{/apps/wallet.apk}" class="btn btn-primary">Download </a></span>
        </li>
        <li class="list-group-item d-flex justify-content-between align-items-start">
            <div class="ms-2 me-auto">
                <span class="fw-bold">The Verifier App for Android</span>
                <span class="badge bg-secondary">New</span>
            </div>
            <span><a th:href="@{/apps/verifier.apk}" class="btn btn-primary">Download</a></span>
        </li>
    </ul>
</div>
</body>
</html>
