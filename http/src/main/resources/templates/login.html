<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title th:text="${config.metadata.name}">Issuing Service</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.1/css/bootstrap.min.css} "/>
    <script th:src="@{/webjars/bootstrap/5.3.1/js/bootstrap.min.js}"></script>
    <script th:src="@{/webjars/jquery/3.7.1/jquery.min.js}"></script>
    <script th:inline="javascript" language="JavaScript">
        const BASE_URL = /*[[@{/}]]*/ "";
        const STATUS_ENDPOINT = /*[[@{${paths.LoginStatusUrl}}]]*/ '';
        const POLL_INTERVAL_MS = 2000; // 2s
        const POLL_TIMEOUT_MS = 300000; // 5 minutes

        function checkStatus() {
            return fetch(STATUS_ENDPOINT, {
                method: 'GET',
                credentials: 'same-origin',
                headers: { 'Accept': 'application/json' }
            }).then(res => {
                if (!res.ok) throw new Error('Status check failed: ' + res.status);
                return res.json();
            });
        }

        (function startAuthPolling() {
            const start = Date.now();
            const timer = setInterval(async () => {
                const elapsed = Date.now() - start;
                if (elapsed >= POLL_TIMEOUT_MS) {
                    clearInterval(timer);
                    console.warn('Authentication polling timed out');
                    return;
                }

                try {
                    const status = await checkStatus();
                    if (status && status.authenticated === true) {
                        clearInterval(timer);
                        window.location.replace(BASE_URL);
                    }
                } catch (e) {
                    // Optional: backoff or log
                    console.warn(e);
                }
            }, POLL_INTERVAL_MS);

            // Optional: clear on page unload
            window.addEventListener('beforeunload', () => clearInterval(timer));
        })();
    </script>
</head>
<body style="" class="bg-light">
<div th:replace="~{fragments/navbar.html :: navbar}"></div>
<div class="container py-4">
    <h2>Login with username and password</h2>
    <div class="lead mt-4 mb-5">
        <p th:if="${loginError}" class="text-danger">Login error: <span th:text="${loginError}"/></p>
        <form th:action="@{${paths.LoginUrl}}" method="post" class="form-signin">
            <label for="username">Username</label>:
            <input class="form-control" placeholder="user" type="text" id="username" name="username"
                   autofocus="autofocus"/>
            <br/>
            <label for="password">Password</label>:
            <input class="form-control" placeholder="password" type="password" id="password" name="password"/> <br/>
            <button class="btn btn-lg btn-primary btn-block" type="submit">Sign in</button>
        </form>
    </div>

    <h2>Login with ID Austria</h2>
    <div class="lead mt-4 mb-5 list-group">
        <p th:each="url : ${oauthUrls}">
            <a th:text="${url.name}" th:href="@{${url.url}}">Client</a>
        </p>
        <p>You might use <a href="https://www.id-austria.gv.at/de/developer/testen/vordefinierte-testidentit%C3%A4ten">ID
            Austria test credentials</a>, but only for the login with ID Austria!</p>
    </div>

    <div th:if="${loginPidUrl} != null">
        <h2>Login with PID from your Wallet</h2>
        <div class="lead mt-4 mb-5">
            <p>
                <img th:src="|data:image/png;base64,${loginPidQrCode}|" width="500"/>
            </p>
            <p>
                <a th:href="${loginPidUrl}">Open Wallet</a>
            </p>
        </div>
    </div>
</div>
</body>
</html>
