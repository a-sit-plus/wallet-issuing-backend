<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <meta charset="UTF-8">
    <title>A-SIT Plus Wallet</title>
    <link th:rel="stylesheet" th:href="@{/webjars/bootstrap/5.1.3/css/bootstrap.min.css} "/>
</head>
<!--/*@thymesVar id="error" type="java.lang.String"*/-->
<!--/*@thymesVar id="qrcode" type="java.lang.String"*/-->
<!--/*@thymesVar id="qrcodeWidth" type="java.lang.Integer"*/-->
<body style="background: #ececec;">
<div th:replace="fragments/navbar.html :: navbar"></div>
<div class="container pt-3">
    <h1 class="display-4">Initialize Wallet</h1>
    <div th:unless="${error} != null">
        <p class="lead">
            Scan this QR Code with your Wallet App to create a device binding, to be able to load credentials
            afterwards.
        </p>
        <div class="d-flex justify-content-center my-3">
            <img th:width="${qrcodeWidth}" th:src="'data:image/png;base64,'+${qrcode}" alt="" src=""/>
        </div>
    </div>
    <div th:if="${error} != null">
        <p>Internal server error occurred, please retry later.</p>
        <p>Details: <span th:text="${error}"></span></p>
    </div>
</div>
</body>
</html>
