spring:
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        jdbc:
          lob:
            non_contextual_creation: true
  datasource:
    url: "jdbc:h2:mem:userstore"

backend:
  public-context: "http://localhost:8080"
  credential-lifetime: PT60M

server:
  port: 8080
