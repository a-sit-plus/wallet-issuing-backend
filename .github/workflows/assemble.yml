name: Assemble
on: [push, pull_request]
jobs:
  build:
    # Pushes to this repository already run the build, so run pull requests only from forks
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      - uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Cache maven
        uses: actions/cache@v4
        env:
          cache-name: cache-maven
        with:
          path: |
            ~/.m2/repository
          key: issuing-${{ hashFiles('./gradle/libs.versions.toml') }}
      - name: Run tests
        run: |
          ./gradlew --continue clean assemble test build
      - name: Test Report
        uses: dorny/test-reporter@v1
        # The token of pull requests from forks is read-only and cannot create check runs
        if: (success() || failure()) && github.event_name == 'push'
        with:
          name: Tests
          path: 'http/build/test-results/test/**/TEST-*.xml'
          reporter: java-junit
